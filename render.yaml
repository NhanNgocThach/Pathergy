services:
  - type: web
    name: pathergy-api
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_TOKEN_HASH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_DEVELOPMENT_MODE
        value: "false"
      - key: AUTH_DEVELOPMENT_BASE_URL
        sync: false
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "30"
